    function renderLockPanel() {
      var panel = wrap.querySelector("#lockPanel");
      if (!panel) return;
      var html = "";
      if (!Lock.isSet()) {
        html +=
          '<label class="field">' + fieldLabel("새 PIN (숫자 4자리 이상)") + '<input class="input" type="password" inputmode="numeric" autocomplete="off" id="lockNewPin" maxlength="12" placeholder="예: 1234" /></label>' +
          '<label class="field">' + fieldLabel("PIN 확인") + '<input class="input" type="password" inputmode="numeric" autocomplete="off" id="lockNewPinConfirm" maxlength="12" /></label>' +
          '<button class="btn btn-primary" id="lockSetBtn">PIN 설정</button>' +
          '<p class="tiny muted" style="margin-top:8px;">PIN은 이 브라우저 안에만 저장돼요. PIN을 잊어버리면 이 브라우저의 사이트 데이터를 지워야 하는데, 그러면 저장된 기록도 함께 사라져요. 꼭 기억해두시고, 걱정되면 미리 "JSON으로 내보내기"로 백업해두세요.</p>';
      } else {
        html +=
          '<p class="small">🔒 화면 잠금이 켜져 있어요.</p>' +
          '<button class="btn" id="lockChangeBtn">PIN 변경</button> ' +
          '<button class="btn btn-danger" id="lockRemoveBtn">화면 잠금 끄기</button>';
      }
      panel.innerHTML = html;
      var setBtn = panel.querySelector("#lockSetBtn");
      if (setBtn) setBtn.addEventListener("click", function () {
        var p1 = panel.querySelector("#lockNewPin").value;
        var p2 = panel.querySelector("#lockNewPinConfirm").value;
        if (!/^\d{4,12}$/.test(p1)) { showToast("숫자 4자리 이상으로 입력해주세요", true); return; }
        if (p1 !== p2) { showToast("PIN이 서로 달라요", true); return; }
        Lock.setPin(p1, function () { showToast("화면 잠금을 켰어요"); renderLockPanel(); });
      });
      var changeBtn = panel.querySelector("#lockChangeBtn");
      if (changeBtn) changeBtn.addEventListener("click", function () {
        var cur = prompt("현재 PIN을 입력해주세요");
        if (cur == null) return;
        Lock.verify(cur, function (ok) {
          if (!ok) { showToast("현재 PIN이 올바르지 않아요", true); return; }
          var next = prompt("새 PIN을 입력해주세요 (숫자 4자리 이상)");
          if (next == null) return;
          if (!/^\d{4,12}$/.test(next)) { showToast("숫자 4자리 이상으로 입력해주세요", true); return; }
          Lock.setPin(next, function () { showToast("PIN을 변경했어요"); });
        });
      });
      var removeBtn = panel.querySelector("#lockRemoveBtn");
      if (removeBtn) removeBtn.addEventListener("click", function () {
        var cur = prompt("현재 PIN을 입력하면 화면 잠금을 끌 수 있어요");
        if (cur == null) return;
        Lock.verify(cur, function (ok) {
          if (!ok) { showToast("현재 PIN이 올바르지 않아요", true); return; }
          Lock.clearPin();
          showToast("화면 잠금을 껐어요");
          renderLockPanel();
        });
      });
    }
    renderLockPanel();

    function renderSyncPanel() {
      var panel = wrap.querySelector("#syncPanel");
      if (!panel) return;
      var s = Sync.getStatus();
      var clientId = Sync.getClientId();
      var html = "";
      if (!clientId) {
        html +=
          '<label class="field">' + fieldLabel("구글 OAuth 클라이언트 ID") + '<input class="input" type="text" id="syncClientIdInput" placeholder="xxxxxxxx.apps.googleusercontent.com" /></label>' +
          '<button class="btn btn-primary" id="syncSaveClientId" style="margin-top:6px;">동기화 설정 저장</button>' +
          '<details style="margin-top:12px;"><summary class="small" style="cursor:pointer; font-weight:600;">클라이언트 ID는 어떻게 만드나요?</summary>' +
            '<ol class="small muted" style="padding-left:18px; line-height:1.9; margin-top:8px;">' +
              '<li>구글 계정으로 <b>Google Cloud Console</b>(console.cloud.google.com)에 접속해 새 프로젝트를 만들어요.</li>' +
              '<li>"API 및 서비스 → 라이브러리"에서 <b>Google Sheets API</b>와 <b>Google Drive API</b>를 각각 사용 설정해요.</li>' +
              '<li>"API 및 서비스 → OAuth 동의 화면"에서 User Type을 "외부"로 만들고, 게시 상태는 <b>테스트</b>로 둔 채 본인 구글 계정을 테스트 사용자로 추가해요. 개인용이라 이 상태로도 계속 쓸 수 있어요(구글 심사 불필요).</li>' +
              '<li>"API 및 서비스 → 사용자 인증 정보 → 사용자 인증 정보 만들기 → OAuth 클라이언트 ID"에서 애플리케이션 유형을 <b>웹 애플리케이션</b>으로 선택해요.</li>' +
              '<li>"승인된 자바스크립트 원본"에 이 앱이 올라간 주소(예: https://아이디.github.io)를 추가해요.</li>' +
              '<li>만들어진 <b>클라이언트 ID</b>(...apps.googleusercontent.com으로 끝나는 문자열)를 위 입력칸에 붙여넣고 저장해요.</li>' +
            '</ol>' +
          '</details>';
      } else if (!s.signedIn) {
        html +=
          '<p class="small">동기화 설정이 저장돼 있어요.</p>' +
          (s.error ? '<p class="tiny" style="color:#c0392b;">' + escapeHtml(s.error) + '</p>' : '') +
          '<button class="btn btn-primary" id="syncSignIn">구글 계정으로 로그인</button> ' +
          '<button class="btn" id="syncClearClientId" style="margin-top:6px;">설정 지우기</button>';
      } else {
        html +=
          '<p class="small">' + (s.email ? escapeHtml(s.email) + " 계정으로 " : "") + '연결됨' +
            (s.syncing ? ' · 동기화 중…' : (s.lastSyncedAt ? ' · 마지막 동기화 ' + fmtRelativeTime(s.lastSyncedAt) : ' · 아직 동기화한 적 없음')) + '</p>' +
          (s.error ? '<p class="tiny" style="color:#c0392b;">' + escapeHtml(s.error) + '</p>' : '') +
          '<button class="btn btn-primary" id="syncNowBtn"' + (s.syncing ? " disabled" : "") + '>지금 동기화</button> ' +
          '<button class="btn" id="syncSignOut">로그아웃</button> ' +
          '<button class="btn" id="syncClearClientId">설정 지우기</button>';
      }
      panel.innerHTML = html;
      var saveIdBtn = panel.querySelector("#syncSaveClientId");
      if (saveIdBtn) saveIdBtn.addEventListener("click", function () {
        var v = panel.querySelector("#syncClientIdInput").value.trim();
        if (!v) { showToast("클라이언트 ID를 입력해주세요", true); return; }
        Sync.setClientId(v);
        showToast("저장했어요. 이제 로그인해주세요.");
      });
      var signInBtn = panel.querySelector("#syncSignIn");
      if (signInBtn) signInBtn.addEventListener("click", function () {
        Sync.signIn(function (err) { if (!err) Sync.syncNow(); });
      });
      var syncNowBtn = panel.querySelector("#syncNowBtn");
      if (syncNowBtn) syncNowBtn.addEventListener("click", function () { Sync.syncNow(); });
      var signOutBtn = panel.querySelector("#syncSignOut");
      if (signOutBtn) signOutBtn.addEventListener("click", function () { Sync.signOut(); });
      var clearBtn = panel.querySelector("#syncClearClientId");
      if (clearBtn) clearBtn.addEventListener("click", function () {
        if (!confirm("동기화 설정을 지울까요? (저장된 기록 자체는 지워지지 않고, 구글 시트에 백업된 내용도 그대로 남아있어요)")) return;
        Sync.signOut(); Sync.setClientId("");
      });
    }
    renderSyncPanel();
    Sync.on(renderSyncPanel);

    wrap.querySelector("#exportBtn").addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "life-hexagon-data-" + todayISO() + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("내보냈어요");
    });
    wrap.querySelector("#importFile").addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try {
          parsed = JSON.parse(reader.result);
        } catch (err) {
          alert("올바른 JSON 파일이 아니에요.");
          return;
        }
        if (!confirm("가져오면 현재 브라우저에 저장된 데이터를 덮어씁니다. 계속할까요?")) return;
        // JSON 파싱 자체는 성공했으므로, 이후 단계(데이터 반영·화면 갱신)에서 문제가 나도
        // "파일이 잘못됐다"는 오해를 주지 않도록 별도로 처리한다. normalizeData가 예전 버전
        // 백업의 누락된 필드를 채워주지만, 혹시 모를 예외에도 안내 문구는 정확하게 보여준다.
        try {
          DB.replace(parsed);
          showToast("가져왔어요");
          navigate("home");
        } catch (err) {
          console.error("가져온 데이터를 반영하는 중 오류가 발생했습니다.", err);
          alert("파일은 읽었지만 데이터를 적용하는 중 문제가 발생했어요. 페이지를 새로고침한 뒤 다시 시도해주세요.");
        }
      };
      reader.readAsText(file);
    });
    wrap.querySelector("#resetBtn").addEventListener("click", function () {
      if (!confirm("정말 모든 기록을 삭제할까요? 이 동작은 되돌릴 수 없어요.")) return;
      if (!confirm("한 번 더 확인할게요. 정말 전체 초기화할까요?")) return;
      DB.reset();
      showToast("초기화했어요");
      navigate("home");
    });
    return wrap;
  }

  var VIEWS = { home: viewHome, quick: viewQuickHub, records: viewRecords, compare: viewCompare, settings: viewSettings, coach: viewCoach };

  /* ============================== 초기화 ============================== */
  function applyTheme() {
    var theme = DB.get().settings.theme || "light";
    document.documentElement.setAttribute("data-theme", theme);
    var btn = document.getElementById("themeToggle");
    if (btn) btn.textContent = theme === "dark" ? "☀" : "◐";
  }

  document.getElementById("recordSheetBackdrop").addEventListener("click", closeRecordSheet);
  document.getElementById("infoSheetBackdrop").addEventListener("click", closeInfoSheet);
  document.getElementById("infoSheetClose").addEventListener("click", closeInfoSheet);
  // (ⓘ) 버튼은 여러 화면에서 동적으로 다시 그려지므로, 매번 다시 바인딩하는 대신
  // 문서 전체에 위임된 클릭 리스너 하나로 처리한다.
  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest(".info-btn");
    if (btn) openInfoSheet(btn.getAttribute("data-info"));
  });

  /* 모바일 온스크린 키보드 대응: 키보드가 뜨면 visualViewport 높이가 레이아웃 뷰포트보다
     확 줄어드는 것을 감지해서 body에 kb-open 클래스를 붙인다(위 CSS가 하단 내비를 숨김).
     visualViewport API를 지원하지 않는 환경에서는 그냥 조용히 건너뛴다. */
  if (window.visualViewport) {
    (function () {
      var vv = window.visualViewport;
      function handleViewportResize() {
        var shrunk = (window.innerHeight - vv.height) > 120;
        document.body.classList.toggle("kb-open", shrunk);
      }
      vv.addEventListener("resize", handleViewportResize);
      handleViewportResize();
    })();
  }

  /* 입력 필드(직접 탭했든, 자동 포커스로 이동했든)에 포커스가 갈 때마다 키보드가 올라오는
     애니메이션이 끝나길 잠시 기다린 뒤 화면 중앙 쪽으로 스크롤해서, 키보드나 하단 바에
     가려지지 않게 한다. */
  document.addEventListener("focusin", function (e) {
    var el = e.target;
    if (!el || !el.matches || !el.matches("input, textarea, select")) return;
    setTimeout(function () {
      try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (err) { /* 무시 */ }
    }, 320);
  });

  // 온라인(https)으로 열었을 때만 서비스워커를 등록해 오프라인 캐싱 + "홈 화면에 추가"를 지원한다.
  // 로컬 file://로 열었을 때는 서비스워커 자체가 동작하지 않는 컨텍스트라 아무 일도 하지 않는다.
  if (typeof navigator !== "undefined" && "serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* 파일이 없어도(단순 파일 호스팅 등) 무시 */ });
    });
  }

  function bootApp() {
    applyTheme();
    // 클라우드 동기화가 설정돼 있으면(설정 화면에서 구글 클라이언트 ID를 저장한 적이 있으면)
    // 앱을 열 때마다 조용히 한 번 동기화를 시도한다. 설정한 적이 없으면 아무 일도 하지 않는다.
    Sync.autoSyncOnLoad();
    // 앱을 맨 처음 여는 순간 localStorage에 기본 데이터(및 firstUsedAt)를 한 번 기록해 둔다.
    // 예전엔 이 저장이 accountAgeDays()(홈 화면 렌더링 중 호출) 안에서만 일어났는데, 기록이
    // 하나도 없는 신규 사용자에게는 홈 화면 대신 환영 화면을 보여주면서 accountAgeDays()가
    // 아예 호출되지 않게 되어, 그 사용자의 첫 기록 전까지는 localStorage 자체가 비어 있는
    // 상태가 됐다. 화면 종류와 상관없이 앱 시작 시 항상 한 번 저장되도록 여기서 처리한다.
    accountAgeDays();
    navigate("home");
  }
  // 화면 잠금(PIN)을 설정해둔 적이 있고, 이 브라우저 탭에서 아직 풀지 않았다면 앱을 바로
  // 열지 않고 PIN 입력 화면부터 보여준다. 설정한 적이 없으면(기본값) 지금까지와 동일하게
  // 잠금 화면 없이 바로 시작한다.
  if (Lock.isSet() && !Lock.isUnlockedThisSession()) {
    renderLockGate(bootApp);
  } else {
    bootApp();
  }
})();
</script>
</body>
</html>
