<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 아래 두 줄은 이 파일을 로컬 file://로 직접 열 때는 조용히 무시되고,
     GitHub Pages 같은 곳에 올려서 온라인으로 쓸 때만 "홈 화면에 추가"와 오프라인 캐싱을 켠다. -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<title>GS Fit</title>
<style>
  :root {
    /* 토스 디자인 시스템(TDS) 공식 컬러 토큰 기준: blue500/blue50, grey900/grey50, red500, green500 */
    --color-bg: #f2f4f6;
    --color-surface: #ffffff;
    --color-border: #e5e8eb;
    --color-ink: #191f28;
    --color-ink-muted: #8b95a1;
    --color-brand: #3182f6;
    --color-brand-light: #5b9df9;
    --color-accent: #3182f6;
    --color-accent-light: #e8f3ff;
    --color-positive: #03b26c;
    --color-negative: #f04452;
    --color-neutral: #8b95a1;
    --color-prev-month: #d1d6db;
    --color-press: rgba(25, 31, 40, 0.05);
    --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
    /* 하단 내비게이션 전용 브랜드 보라색: 핵심 행동(기록 추가 FAB)과 활성 상태에만 제한적으로 사용 */
    --nav-active: #6D5CE7;
    --nav-inactive: #9CA3AF;
    --nav-fab-bg: #6D5CE7;
    --nav-fab-shadow: 0 4px 14px rgba(109, 92, 231, 0.35);
    /* 카테고리별 아이콘 배지 배경 (라이트) */
    --tint-company: #e8f3ff;
    --tint-exercise: #f3e8ff;
    --tint-family: #ffe8ef;
    --tint-side_project: #eaecff;
    --tint-extra_income: #fff6d9;
    --tint-self_time: #e3faf0;
    --tint-thought: #eef0f2;
    --tint-investment: #e0f7fa;
  }
  html[data-theme="dark"] {
    --color-bg: #101114;
    --color-surface: #1c1e22;
    --color-border: #32353b;
    --color-ink: #f2f4f6;
    --color-ink-muted: #8b95a1;
    --color-brand: #4b9eff;
    --color-brand-light: #7ab8ff;
    --color-accent: #4b9eff;
    --color-accent-light: rgba(75, 158, 255, 0.16);
    --color-positive: #3ddc97;
    --color-negative: #ff6b6b;
    --color-neutral: #9aa4b2;
    --color-prev-month: #454b54;
    --color-press: rgba(255, 255, 255, 0.06);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.24), 0 8px 24px rgba(0, 0, 0, 0.32);
    color-scheme: dark;
    --nav-active: #8d7ef2;
    --nav-inactive: #7a808c;
    --nav-fab-bg: #6D5CE7;
    --nav-fab-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    /* 카테고리별 아이콘 배지 배경 (다크) */
    --tint-company: rgba(75, 158, 255, 0.18);
    --tint-exercise: rgba(191, 120, 246, 0.2);
    --tint-family: rgba(255, 120, 160, 0.18);
    --tint-side_project: rgba(140, 148, 255, 0.2);
    --tint-extra_income: rgba(255, 205, 70, 0.18);
    --tint-self_time: rgba(60, 220, 150, 0.18);
    --tint-thought: rgba(255, 255, 255, 0.08);
    --tint-investment: rgba(45, 212, 191, 0.2);
  }
  /* ============================== 앱 전체 "차분한 그라데이션" 무드 ==============================
   * 처음엔 홈 화면에만 켰다가(body.home-glow 클래스로 스코프), 마음에 든다고 하셔서 앱 전체로
   * 확장했다. 배경 블롭 + 카드 유리질감 + 포인트 그라데이션(블루→퍼플→핑크)을 전 화면에 공통으로
   * 쓰고, 헥사곤 차트는 #hexHolder(홈)·#hexHolder2(월간 분석) 둘 다 같은 톤을 받는다. */
  body {
    background:
      radial-gradient(420px 340px at 8% -8%, rgba(107, 132, 240, .09), transparent 62%),
      radial-gradient(380px 320px at 108% 16%, rgba(231, 155, 179, .07), transparent 62%),
      radial-gradient(360px 300px at 22% 100%, rgba(165, 139, 220, .07), transparent 62%),
      var(--color-bg);
    background-attachment: fixed;
  }
  html[data-theme="dark"] body {
    background:
      radial-gradient(420px 340px at 8% -8%, rgba(107, 132, 240, .15), transparent 62%),
      radial-gradient(380px 320px at 108% 16%, rgba(231, 155, 179, .11), transparent 62%),
      radial-gradient(360px 300px at 22% 100%, rgba(165, 139, 220, .13), transparent 62%),
      var(--color-bg);
    background-attachment: fixed;
  }
  .card, .stat-card, .insight-item { background: rgba(255, 255, 255, .90); backdrop-filter: blur(10px); }
  html[data-theme="dark"] .card, html[data-theme="dark"] .stat-card, html[data-theme="dark"] .insight-item {
    background: rgba(28, 30, 34, .82); backdrop-filter: blur(10px);
  }
  .stat-value {
    background: linear-gradient(135deg, #6b84f0, #a58bdc 55%, #e79bb3);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  html[data-theme="dark"] .stat-value {
    background: linear-gradient(135deg, #90a4ff, #c3aef0 55%, #f3b5c8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  /* 헥사곤 차트(홈의 #hexHolder, 월간 분석의 #hexHolder2)에 이 세 변수를 얹으면, renderHexagon()이
     그리는 SVG 그라데이션이 블루 한 가지 색 대신 블루→퍼플→핑크로 보인다(fallback 방식이라
     var()가 없는 곳은 자동으로 기존 단색 브랜드 컬러를 그대로 쓴다 - 안전한 점진 적용용이었지만
     이제 두 곳 다 켜둔다). */
  #hexHolder, #hexHolder2 { --hex-grad-2: #a58bdc; --hex-grad-3: #e79bb3; --hex-stroke-2: #a58bdc; }
  html[data-theme="dark"] #hexHolder, html[data-theme="dark"] #hexHolder2 {
    --hex-grad-2: #b39ce8; --hex-grad-3: #f0a8bf; --hex-stroke-2: #b39ce8;
  }
  /* 카드 제목 앞에 붙는 작은 그라데이션 아이콘 배지(자동 인사이트/코치 피드백/투자 기록/월간
     리포트/영역별 비교 등) - 새 클래스라 기존 것과 충돌하지 않는다. */
  .ai-icon-badge {
    display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 7px; margin-right: 6px; font-size: 12px; vertical-align: -6px;
    background: linear-gradient(135deg, #6b84f0, #a58bdc 55%, #e79bb3);
  }
  html[data-theme="dark"] .ai-icon-badge {
    background: linear-gradient(135deg, #5b73e0, #8f72c9 55%, #d98aa3);
  }
  /* 연속 기록 배지도 같은 톤의 은은한 그라데이션 알약 모양으로. */
  .cal-streak {
    display: inline-flex; padding: 6px 12px; border-radius: 999px;
    background: linear-gradient(135deg, rgba(107, 132, 240, .12), rgba(231, 155, 179, .12));
  }
  html[data-theme="dark"] .cal-streak {
    background: linear-gradient(135deg, rgba(107, 132, 240, .20), rgba(231, 155, 179, .16));
  }
  /* 홈 화면 맨 위 인사 영역(아바타 + "안녕하세요, GS님" + 날씨/날짜, 오른쪽엔 설정 바로가기) */
  .home-greet-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .home-greet-left { display: flex; align-items: center; gap: 10px; }
  .home-greet-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; color: #fff; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6b84f0, #a58bdc 55%, #e79bb3);
    box-shadow: 0 5px 12px rgba(120, 100, 200, .26);
  }
  html[data-theme="dark"] .home-greet-avatar { background: linear-gradient(135deg, #5b73e0, #8f72c9 55%, #d98aa3); }
  .home-greet-title { font-size: 16px; font-weight: 800; }
  .home-greet-sub { font-size: 12px; color: var(--color-ink-muted); margin-top: 1px; }
  .home-greet-settings { border: 1px solid var(--color-border); background: var(--color-surface); }
  /* "AI가 오늘의 균형을 살펴봤어요" 배지 - 실제로 매 화면마다 계산되는 라이프 점수/조화지수
     대시보드를 가리키는 장식적 문구다(별도 LLM 호출은 없음). */
  .home-ai-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
    color: #7a6bc4; background: linear-gradient(135deg, #f1eefc, #fdf0f4); padding: 4px 11px; border-radius: 999px;
  }
  html[data-theme="dark"] .home-ai-badge { color: #cfc2f5; background: linear-gradient(135deg, rgba(107,132,240,.22), rgba(231,155,179,.16)); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 화면 맨 위에서 아래로 당기면 브라우저 기본 "당겨서 새로고침"이 발동해 페이지 전체가
     새로고침되는데, 이때 구글 시트 동기화가 설정돼 있으면 조용히 토큰을 갱신하려다
     실패해 구글 로그인 화면이 뜨는 경우가 있다. 앱이 자체 스크롤을 담당하므로 브라우저의
     당겨서 새로고침 제스처 자체를 막아 이런 오작동을 방지한다. */
  html { overscroll-behavior-y: contain; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  button { transition: transform .12s ease, opacity .12s ease, background-color .12s ease; }
  button:active { transform: scale(0.97); }

  #app { min-height: 100vh; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: 220px;
    background: var(--color-surface); border-right: 1px solid var(--color-border);
    padding: 20px 14px; display: none;
  }
  .brand { font-size: 18px; font-weight: 700; color: var(--color-brand); padding: 0 8px 24px; }
  .navlist { display: flex; flex-direction: column; gap: 2px; }
  .navitem {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    font-size: 14px; font-weight: 500; color: var(--color-ink-muted); cursor: pointer; border: none; background: none; text-align: left; width: 100%;
  }
  .navitem .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-border); flex-shrink: 0; }
  .navitem.active { background: var(--color-accent-light); color: var(--color-brand); }
  .navitem.active .dot { background: var(--color-brand); }
  .navitem:hover:not(.active) { background: var(--color-press); }

  main { padding-bottom: 104px; }
  /* 모바일 키보드가 올라오면(visualViewport 축소 감지) 하단 고정 내비게이션을 잠시 숨겨서,
     입력 필드나 만족도 버튼 같은 요소가 키보드/하단 바에 가려지지 않도록 한다. */
  body.kb-open .bottom-nav { display: none; }
  body.kb-open main { padding-bottom: 24px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--color-ink-muted); font-size: 16px;
  }
  .icon-btn:hover { background: var(--color-press); }

  .view { padding: 18px 16px 24px; }
  .card {
    background: var(--color-surface); border-radius: 20px; box-shadow: var(--shadow-card);
    padding: 18px;
  }
  .card + .card { margin-top: 14px; }
  .section-title { font-size: 15px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em; }
  .muted { color: var(--color-ink-muted); }
  .small { font-size: 12px; }
  .tiny { font-size: 11px; }

  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
  .stat-card { background: var(--color-surface); border-radius: 18px; box-shadow: var(--shadow-card); padding: 16px; }
  .stat-label { font-size: 12px; color: var(--color-ink-muted); margin-bottom: 6px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
  /* 라이프 점수·조화지수처럼 낯선 용어 옆에 붙는 설명 버튼. 탭하면 정보 시트가 뜬다. */
  .info-btn {
    border: none; background: none; padding: 0; margin: 0; color: var(--color-ink-muted);
    font-size: 12px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  }
  .info-btn:active { background: var(--color-accent-light); }
  .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .stat-delta { font-size: 12px; margin-top: 4px; font-weight: 600; }
  .up { color: var(--color-positive); } .down { color: var(--color-negative); } .flat { color: var(--color-neutral); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 14px; border: 1px solid var(--color-border); background: var(--color-surface);
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--color-ink);
    transition: transform .12s ease, opacity .12s ease, background-color .12s ease;
  }
  .btn:hover { background: var(--color-press); }
  .btn-primary {
    background: linear-gradient(135deg, #6b84f0, #a58bdc 55%, #e79bb3);
    color: #fff; border: none; box-shadow: 0 8px 20px rgba(120, 100, 200, .22);
  }
  html[data-theme="dark"] .btn-primary {
    background: linear-gradient(135deg, #5b73e0, #8f72c9 55%, #d98aa3);
    box-shadow: 0 8px 20px rgba(0, 0, 0, .4);
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-danger { color: var(--color-negative); border-color: var(--color-negative); background: none; }
  .btn-block { width: 100%; padding: 15px; border-radius: 18px; font-size: 15px; font-weight: 700; }
  .btn[disabled] { opacity: .5; cursor: default; }

  label.field { display: block; margin-bottom: 14px; }
  .field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  /* 금액(원) 입력란 아래 "9,000원"처럼 천 단위 콤마를 넣어 보여주는 실시간 미리보기 */
  .amount-hint { display: block; margin-top: 4px; font-size: 12px; color: var(--color-ink-muted); min-height: 15px; }
  .input, select.input, textarea.input {
    width: 100%; border: 1px solid var(--color-border); border-radius: 10px; background: transparent;
    padding: 10px 12px; font-size: 14px; color: var(--color-ink);
  }
  textarea.input { resize: vertical; min-height: 56px; }
  .input:focus, select.input:focus, textarea.input:focus { outline: 2px solid var(--color-accent-light); border-color: var(--color-brand); }

  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--color-border); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; background: none; color: var(--color-ink);
  }
  .chip.selected { border-color: var(--color-brand); background: var(--color-accent-light); color: var(--color-brand); font-weight: 600; }

  .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tile {
    background: var(--color-surface); border-radius: 20px; box-shadow: var(--shadow-card); padding: 16px;
    display: flex; flex-direction: column; gap: 6px; cursor: pointer; border: none; text-align: left; color: var(--color-ink);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(15, 23, 42, 0.06), 0 12px 28px rgba(15, 23, 42, 0.09); }
  .tile .badge { width: 40px; height: 40px; border-radius: 12px; background: var(--color-accent-light); color: var(--color-brand); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; line-height: 1; }
  .badge-company { background: var(--tint-company); }
  .badge-exercise { background: var(--tint-exercise); }
  .badge-family { background: var(--tint-family); }
  .badge-side_project { background: var(--tint-side_project); }
  .badge-extra_income { background: var(--tint-extra_income); }
  .badge-self_time { background: var(--tint-self_time); }
  .badge-thought { background: var(--tint-thought); }
  .badge-investment { background: var(--tint-investment); }
  .tile .t-label { font-size: 14px; font-weight: 700; }
  .tile .t-desc { font-size: 11px; color: var(--color-ink-muted); }
  .ex-del {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--color-ink-muted); color: #fff; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.2);
  }
  .ex-del:hover { background: var(--color-negative); }

  .segmented { display: flex; background: var(--color-bg); border-radius: 12px; padding: 3px; gap: 2px; margin-top: 10px; }
  .segmented button {
    flex: 1; border: none; background: none; padding: 8px 10px; font-size: 13px; font-weight: 600;
    color: var(--color-ink-muted); border-radius: 9px; cursor: pointer; transition: background-color .12s ease, color .12s ease;
  }
  .segmented button.active { background: var(--color-surface); color: var(--color-ink); box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08); }

  .range-label { font-size: 12px; color: var(--color-ink-muted); text-align: center; margin-top: 10px; }
  .chart-legend { display: flex; gap: 16px; justify-content: center; margin-top: 2px; font-size: 12px; color: var(--color-ink-muted); }
  .chart-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  .cmp-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border); }
  .cmp-row:last-child { border-bottom: none; }
  .cmp-row .badge { width: 36px; height: 36px; border-radius: 10px; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .cmp-info { flex: 1; min-width: 0; }
  .cmp-label { font-size: 14px; font-weight: 700; }
  .cmp-values { font-size: 12px; color: var(--color-ink-muted); margin-top: 2px; }
  .delta-pill { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; flex-shrink: 0; }
  .delta-pill.up { color: var(--color-positive); background: rgba(3, 178, 108, 0.12); }
  .delta-pill.down { color: var(--color-negative); background: rgba(240, 68, 82, 0.12); }
  .delta-pill.flat { color: var(--color-neutral); background: var(--color-press); }

  .tabbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabbar .tabbtn {
    border-radius: 999px; padding: 7px 16px; font-size: 13px; font-weight: 600; border: 1px solid var(--color-border); background: none; cursor: pointer; color: var(--color-ink);
  }
  .tabbar .tabbtn.active { background: var(--color-brand); color: #fff; border-color: var(--color-brand); }

  /* 하단 내비게이션: 이모지 없이 Lucide 라인 아이콘 + 텍스트, 활성 상태는 색상만으로 표현 */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: flex-start;
    background: var(--color-surface); border-top: 1px solid var(--color-border);
    padding: 10px 4px calc(10px + env(safe-area-inset-bottom));
  }
  .bottom-nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    min-height: 44px; padding: 2px 0;
    font-size: 11px; font-weight: 600; border: none; background: none; cursor: pointer; color: var(--nav-inactive);
    transition: color .12s ease;
  }
  .bottom-nav button.active { color: var(--nav-active); }
  .bnav-icon { display: flex; align-items: center; justify-content: center; line-height: 1; }
  .bnav-icon svg { display: block; width: 22px; height: 22px; }
  .bnav-label { font-size: 11px; }
  /* 중앙 "기록 추가" 플로팅 버튼: 56px 원형, 브랜드 보라색, 흰색 Plus 아이콘, 하단 바 위로 약 16px 돌출 */
  .bottom-nav button.bnav-fab {
    flex: 0 0 auto; width: 56px; height: 56px; padding: 0; margin: -27px 6px 0; border-radius: 50%;
    background: linear-gradient(135deg, #6b84f0, #a58bdc 55%, #e79bb3); border: none; color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--nav-fab-shadow); cursor: pointer;
  }
  html[data-theme="dark"] .bottom-nav button.bnav-fab {
    background: linear-gradient(135deg, #5b73e0, #8f72c9 55%, #d98aa3);
  }
  .bnav-fab-icon { display: flex; align-items: center; justify-content: center; line-height: 1; }
  .bnav-fab-icon svg { display: block; width: 24px; height: 24px; }
  /* DOM 순서(홈·기록 추가·기록·월간 분석·설정)는 그대로 두고,
     시각적으로만 "기록 추가" + 버튼을 가운데(3번째)로 옮긴다. */
  .bottom-nav button:nth-child(1) { order: 1; }
  .bottom-nav button:nth-child(2) { order: 3; }
  .bottom-nav button:nth-child(3) { order: 2; }
  .bottom-nav button:nth-child(4) { order: 4; }
  .bottom-nav button:nth-child(5) { order: 5; }

  /*
   * 좁은 화면(모바일)에서 "영역" 열처럼 짧고 줄바꿈이 없어야 하는 열이 브라우저 auto 레이아웃
   * 때문에 지나치게 좁아지면, 공백 없는 한글 단어(예: "프로젝트")가 한 글자씩 세로로 쪼개져
   * 보이는 문제가 있었다. 날짜·영역·버튼 열은 줄바꿈을 막아서 항상 필요한 만큼의 너비를
   * 확보하고, "내용" 열만 남은 공간 안에서 자연스럽게 줄바꿈되게 한다(단어 단위로 끊어지도록
   * word-break: keep-all). 그래도 폭이 정말 부족한 경우에만 .table-wrap의 가로 스크롤로 넘어간다.
   */
  table.rt { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.rt th { text-align: left; padding: 8px 10px; font-size: 11px; color: var(--color-ink-muted); border-bottom: 1px solid var(--color-border); }
  table.rt td { padding: 9px 10px; border-bottom: 1px solid var(--color-border); }
  table.rt tr:last-child td { border-bottom: none; }
  table.rt th:nth-child(1), table.rt td:nth-child(1),
  table.rt th:nth-child(2), table.rt td:nth-child(2) { white-space: nowrap; }
  table.rt td:nth-child(3), table.rt th:nth-child(3) { word-break: keep-all; overflow-wrap: break-word; }
  table.rt td:last-child { width: 1px; }
  .rt-actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .rt-actions .btn { white-space: nowrap; flex-shrink: 0; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--color-ink); color: var(--color-bg); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: var(--shadow-card); z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .toast.toast-error { background: var(--color-negative); color: #fff; }

  .lock-screen {
    display: none; position: fixed; inset: 0; z-index: 999; background: var(--color-bg);
    flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;
  }
  .lock-screen.show { display: flex; }
  .lock-screen .lock-icon { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 18px; box-shadow: var(--shadow-card); }
  .lock-screen .lock-title { font-size: 20px; font-weight: 800; color: var(--color-ink); margin-bottom: 6px; }
  .lock-screen .lock-sub { font-size: 13px; color: var(--color-ink-muted); margin-bottom: 26px; max-width: 300px; line-height: 1.6; }
  .lock-screen input.pin-input {
    width: 200px; text-align: center; letter-spacing: 10px; font-size: 22px; font-weight: 700;
    padding: 12px 14px; border-radius: 14px; border: 1px solid var(--color-border);
    background: var(--color-surface); color: var(--color-ink);
  }
  .lock-screen input.pin-input:focus { outline: none; border-color: var(--color-brand); }
  .lock-screen .lock-error { color: var(--color-negative); font-size: 13px; min-height: 18px; margin-top: 12px; font-weight: 600; }
  .lock-screen .btn { width: 200px; margin-top: 14px; }
  .lock-screen.shake .pin-input { animation: lockShake .35s; }
  @keyframes lockShake {
    10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); }
  }

  .legend-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; font-size: 12px; }
  .legend-item { background: var(--color-press); border-radius: 12px; padding: 10px 12px; }
  .legend-item b { font-weight: 700; margin-left: 4px; }

  .insight-item { border-radius: 12px; box-shadow: var(--shadow-card); background: var(--color-surface); padding: 10px 12px; font-size: 13px; margin-bottom: 8px; }
  .insight-item:last-child { margin-bottom: 0; }

  /* 홈 화면 카드 헤더의 "더보기 ›"/"전체보기 ›" 같은 텍스트 링크 버튼. */
  /* padding + 음수 margin으로 실제 보이는 텍스트 크기·위치는 그대로 두면서, 모바일에서 탭하기엔
     너무 작았던 히트 영역(원래 텍스트 줄 높이만큼인 17px 정도)만 44px에 가깝게 넓힌다. */
  .section-link-btn { background: none; border: none; padding: 11px 8px; margin: -11px -8px; font-size: 12px; font-weight: 700; color: var(--nav-active); cursor: pointer; white-space: nowrap; }

  /* 홈 화면 "오늘의 기록" 섹션: 오늘 남긴 기록을 영역별 칩으로 간단히 모아 보여준다. */
  .today-record-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .today-record-chip {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 7px; border-radius: 12px;
    border: 1px solid var(--color-border); background: var(--color-surface); cursor: pointer;
  }
  .today-record-chip .badge { width: 26px; height: 26px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .today-record-chip .t-label { display: block; font-size: 12px; font-weight: 700; }
  .today-record-chip .t-count { display: block; font-size: 10.5px; color: var(--color-ink-muted); }

  /* AI 코치 화면: 상단 뒤로가기 헤더 + 인사이트/추천 액션 탭에서 쓰는 아이콘+텍스트 카드. */
  .coach-header { display: flex; align-items: center; gap: 10px; }
  .coach-card { display: flex; align-items: flex-start; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--color-border); }
  .coach-card:last-child { border-bottom: none; }
  .coach-card-icon {
    width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(107,132,240,.16), rgba(165,139,220,.16) 55%, rgba(231,155,179,.16));
  }
  html[data-theme="dark"] .coach-card-icon { background: linear-gradient(135deg, rgba(107,132,240,.28), rgba(165,139,220,.24) 55%, rgba(231,155,179,.2)); }
  .coach-card-title { font-size: 13.5px; font-weight: 700; margin: 0 0 3px; }
  .coach-card-desc { font-size: 12.5px; color: var(--color-ink-muted); line-height: 1.55; margin: 0; }

  /* 홈 화면 하단의 "이번 달 기록 캘린더" — 하루라도 기록이 있으면 날짜를 브랜드 색 원으로 표시한다. */
  .cal-streak { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .cal-nav-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cal-nav-btn {
    border: none; background: var(--color-accent-light); color: var(--color-ink); width: 30px; height: 30px;
    border-radius: 50%; font-size: 15px; line-height: 1; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .cal-nav-btn:disabled { opacity: 0.35; cursor: default; }
  .cal-dow-row, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow-row { margin-top: 10px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--color-ink-muted); padding-bottom: 6px; }
  .cal-grid { row-gap: 4px; }
  .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  .cal-cell.cal-empty { visibility: hidden; }
  .cal-num {
    width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--color-ink); position: relative;
    border: none; background: none; padding: 0; font-family: inherit; cursor: pointer;
  }
  .cal-cell.cal-has-record .cal-num { background: var(--color-brand); color: #fff; font-weight: 700; }
  .cal-cell.cal-today .cal-num::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid var(--nav-active);
  }
  .cal-legend { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 11px; color: var(--color-ink-muted); }
  .cal-legend .cal-dot-sample { width: 10px; height: 10px; border-radius: 50%; background: var(--color-brand); flex-shrink: 0; }

  .slider-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .slider-row label { width: 96px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .slider-row input[type=range] { flex: 1; }
  .slider-row .sv { width: 22px; text-align: right; font-size: 12px; font-weight: 700; color: var(--color-brand); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .empty-note { border: 1px dashed var(--color-border); border-radius: 16px; padding: 22px; text-align: center; color: var(--color-ink-muted); font-size: 13px; }

  /* "기록 추가" 바텀시트: 중앙 + 버튼을 누르면 뜨는 기록 항목 선택 시트 */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 40; background: rgba(15, 23, 42, 0.45);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .record-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 82vh; overflow-y: auto;
    background: var(--color-surface); border-radius: 20px 20px 0 0;
    padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 28px rgba(15, 23, 42, 0.16);
    transform: translateY(100%); transition: transform .25s ease;
  }
  .record-sheet.show { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--color-border); margin: 4px auto 14px; }
  .sheet-title { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .sheet-row {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 4px;
    border: none; background: none; cursor: pointer; text-align: left; color: var(--color-ink);
    border-bottom: 1px solid var(--color-border); min-height: 44px;
  }
  .sheet-row:last-child { border-bottom: none; }
  .sheet-row .badge { width: 38px; height: 38px; border-radius: 11px; font-size: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .sheet-row-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .sheet-row-label { font-size: 14px; font-weight: 700; }
  .sheet-row-desc { font-size: 11px; color: var(--color-ink-muted); }

  @media (min-width: 860px) {
    .sidebar { display: block; }
    main { margin-left: 220px; padding-bottom: 40px; }
    .bottom-nav { display: none; }
    .view { padding: 28px 32px 32px; max-width: 880px; }
    .tile-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">GS Fit</div>
    <nav class="navlist" id="sidebarNav"></nav>
  </aside>
  <main>
    <div class="view" id="viewRoot"></div>
  </main>
  <nav class="bottom-nav" id="bottomNav"></nav>
  <div class="sheet-backdrop" id="recordSheetBackdrop"></div>
  <div class="record-sheet" id="recordSheet" role="dialog" aria-modal="true" aria-label="기록 추가">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">기록 추가</h2>
    <div id="recordSheetList"></div>
  </div>
  <div class="sheet-backdrop" id="infoSheetBackdrop"></div>
  <div class="record-sheet" id="infoSheet" role="dialog" aria-modal="true" aria-label="설명">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title" id="infoSheetTitle"></h2>
    <p class="small" id="infoSheetBody" style="line-height:1.7; color:var(--color-ink);"></p>
    <button type="button" class="btn btn-block" id="infoSheetClose" style="margin-top:6px;">닫기</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="lock-screen" id="lockScreen" role="dialog" aria-modal="true" aria-label="화면 잠금"></div>

<script>
(function () {
  "use strict";

  /* ============================== 저장소 ============================== */
  var STORAGE_KEY = "lifehex_v1";

  // 6개 영역 모두 동일한 기준으로 평가한다: 영역 최종점수 = 객관지표 100% (만족도는 점수에 반영하지 않음),
  // 그리고 라이프 점수는 6개 영역 점수를 단순 평균(각 1/6, 완전 동률)한다.
  var DEFAULT_WEIGHTS = {
    company: { objective: 1, satisfaction: 0 },
    exercise: { objective: 1, satisfaction: 0 },
    family: { objective: 1, satisfaction: 0 },
    side_project: { objective: 1, satisfaction: 0 },
    extra_income: { objective: 1, satisfaction: 0 },
    self_time: { objective: 1, satisfaction: 0 }
  };

  var CATEGORY_KEYS = ["company", "exercise", "family", "side_project", "extra_income", "self_time"];
  var CATEGORY_LABELS = {
    company: "회사", exercise: "운동", family: "가족",
    side_project: "프로젝트", extra_income: "소득", self_time: "셀프케어"
  };

  function defaultData() {
    return {
      version: 1,
      // 이 기기의 기록이 마지막으로 바뀐 시각. 로컬 전용으로 쓸 때는 아무 의미도 없고,
      // "클라우드 동기화(구글 시트)"를 켰을 때만 어느 쪽이 더 최신인지 비교하는 데 쓰인다.
      _sync: { updatedAt: null },
      companyActivities: [],
      leaveRecords: [],
      exerciseRecords: [],
      familyRecords: [],
      sideProjects: [],
      projectProgressLogs: [],
      extraIncomes: [],
      selfTimeRecords: [],
      thoughtRecords: [],
      investmentRecords: [],
      // 월간 인사이트 리포트. 달(YYYY-MM)마다 최대 1건, 다시 만들면 덮어쓴다. 다른 기기 기록과
      // 섞일 이유가 없고(각 기기에서 그때그때 다시 만들면 되는 파생 데이터라) 클라우드 동기화
      // 대상에는 포함하지 않는다(설정·목표·API 키와 같은 취급).
      monthlyReports: [],
      monthlySatisfaction: {},
      targets: {
        familyParentsContactPerMonth: 8,
        familyParentsMinutesPerMonth: 120,
        familyStarContactPerMonth: 8,
        familyStarMinutesPerMonth: 600,
        selfTimeActivitiesPerMonth: 4,
        selfTimeMonthlyHoursTarget: 40,
        incomeMonthlyTargetKrw: 3000000,
        exerciseWeeklyTarget: 4,
        sideProjectActiveTarget: 5,
        companyMealMonthlyTarget: 5
      },
      settings: {
        onTimeThreshold: "18:20", theme: "light", customExerciseTypes: [],
        // 라이프 코치 피드백을 실제 LLM(Claude API) 호출로 받고 싶을 때만 채우는 값들.
        // 비워두면 기존처럼 완전히 오프라인인 로컬 규칙 기반 피드백을 사용한다.
        coachApiKey: "", coachModel: "claude-haiku-4-5-20251001"
      }
    };
  }

  /**
   * 저장된 데이터(또는 가져오기한 JSON)에 새 버전에서 추가된 필드가 빠져 있어도 안전하게 채워 넣는다.
   * localStorage에서 불러올 때와 "가져오기"로 외부 JSON을 불러올 때 모두 이 함수를 거친다 —
   * 그러지 않으면 예전 백업 파일을 가져왔을 때 없는 배열/설정 필드 때문에 렌더링이 예외로 죽을 수 있다.
   */
  function normalizeData(parsed) {
    var base = defaultData();
    for (var k in base) { if (!(k in parsed) || parsed[k] == null) parsed[k] = base[k]; }
    parsed.targets = Object.assign({}, base.targets, parsed.targets || {});
    parsed.settings = Object.assign({}, base.settings, parsed.settings || {});
    // 추가소득 목표 기본값이 예전(30만원)으로 저장돼 있고 사용자가 직접 바꾼 적이 없다면
    // 새 기본값(300만원)으로 한 번만 올려준다. 이미 직접 다른 값으로 바꿨다면 건드리지 않는다.
    if (parsed.targets.incomeMonthlyTargetKrw === 300000 && !parsed.settings.incomeTargetMigratedV2) {
      parsed.targets.incomeMonthlyTargetKrw = 3000000;
    }
    parsed.settings.incomeTargetMigratedV2 = true;
    // claude-3-5-haiku(-latest)는 Anthropic이 2026-02-19에 완전히 은퇴시킨 모델이다. 예전에
    // 저장된 설정이 그 값을 그대로 갖고 있으면 호출이 항상 실패해서 로컬 피드백으로만 조용히
    // 대체되므로, 사용자가 직접 다른 모델로 바꾼 적이 없는 한 최신 Haiku로 한 번만 올려준다.
    if (/^claude-3-5-haiku(-latest)?$/.test(parsed.settings.coachModel || "")) {
      parsed.settings.coachModel = "claude-haiku-4-5-20251001";
    }
    return parsed;
  }

  var DB = (function () {
    var data = load();
    function load() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultData();
        return normalizeData(JSON.parse(raw));
      } catch (e) {
        console.error("데이터를 불러오지 못해 초기 상태로 시작합니다.", e);
        return defaultData();
      }
    }
    function save() {
      try {
        if (!data._sync) data._sync = { updatedAt: null };
        data._sync.updatedAt = new Date().toISOString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (e) {
        console.error("저장 실패", e);
        return false;
      }
    }
    return {
      get: function () { return data; },
      save: save,
      replace: function (newData) { data = normalizeData(newData); save(); },
      reset: function () { data = defaultData(); save(); }
    };

  /* ============================== 클라우드 동기화 (구글 시트, 선택 기능) ==============================

    function attempt() {
      var pin = input.value;
      if (!pin) return;
      Lock.verify(pin, function (ok) {
        if (ok) {
          Lock.markUnlocked();
          box.classList.remove("show");
          box.innerHTML = "";
          onUnlock();
        } else {
          errorEl.textContent = "PIN이 올바르지 않아요.";
          box.classList.add("shake");
          setTimeout(function () { box.classList.remove("shake"); }, 400);
          input.value = "";
          input.focus();
        }
      });
    }
    box.querySelector("#lockUnlockBtn").addEventListener("click", attempt);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); attempt(); } });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ============================== 날짜 유틸 ============================== */
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function todayISO() { return fmtISO(new Date()); }
  function toYearMonth(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
  function parseISODate(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); }
  function daysInMonth(y, m0) { return new Date(y, m0 + 1, 0).getDate(); }
  function addMonthsSafe(date, delta) {
    var day = date.getDate();
    var anchor = new Date(date.getFullYear(), date.getMonth() + delta, 1);
    anchor.setDate(Math.min(day, daysInMonth(anchor.getFullYear(), anchor.getMonth())));
    return anchor;
  }
  function subMonths(d, n) { return addMonthsSafe(d, -n); }
  function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }
  function diffCalendarDays(a, b) {
    var A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    var B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((A - B) / 86400000);
  }
  function isBeforeDay(a, b) { return a.getTime() < b.getTime(); }

  /** 전월 "동일 기간" 범위 — 전월이 이번 달보다 짧으면 전월 마지막 날로 캡핑한다. */
  function sameRangeInPreviousMonth(rangeStart, rangeEnd) {
    var prevAnchor = subMonths(rangeStart, 1);
    var prevStart = startOfMonth(prevAnchor);
    var dayOffset = diffCalendarDays(rangeEnd, startOfMonth(rangeStart));
    var candidateEnd = new Date(prevStart);
    candidateEnd.setDate(prevStart.getDate() + dayOffset);
    var prevMonthEnd = endOfMonth(prevAnchor);
    var prevEnd = isBeforeDay(prevMonthEnd, candidateEnd) ? prevMonthEnd : candidateEnd;
    return { start: prevStart, end: prevEnd };
  }
  function fullMonthRange(anchor) { return { start: startOfMonth(anchor), end: endOfMonth(anchor) }; }
  function isMonthComplete(anchor, today) {
    var eom = endOfMonth(anchor);
    return isBeforeDay(eom, today) || diffCalendarDays(eom, today) === 0;
  }
  /** 이번 달이 진행 중이면 "동일 기간" 비교로 강제, 끝난 두 달이면 전체 월 비교. */
  function resolveComparisonRanges(currentAnchor, previousAnchor, today) {
    if (!isMonthComplete(currentAnchor, today)) {
      var currentRange = { start: startOfMonth(currentAnchor), end: today };
      var previousRange = sameRangeInPreviousMonth(currentRange.start, currentRange.end);
      return { mode: "same-period", current: currentRange, previous: previousRange };
    }
    return { mode: "full-month", current: fullMonthRange(currentAnchor), previous: fullMonthRange(previousAnchor) };
  }
  /** {start,end}(둘 다 포함)를 [start, end) 문자열 범위로 변환 */
  function toQueryRange(range) {
    var exclusiveEnd = new Date(range.end.getFullYear(), range.end.getMonth(), range.end.getDate() + 1);
    return { start: fmtISO(range.start), end: fmtISO(exclusiveEnd) };
  }
  function inRangeStr(dateStr, range) { return dateStr >= range.start && dateStr < range.end; }
  function rangeDayCount(range) {
    return Math.max(1, diffCalendarDays(parseISODate(range.end), parseISODate(range.start)));
  }

  /* ============================== 점수 엔진 ============================== */
  function capRate(pct) { return Math.max(0, Math.min(100, pct)); }
  function satisfactionToScore(s1to10) {
    if (s1to10 == null) return null;
    return Math.max(0, Math.min(100, ((s1to10 - 1) / 9) * 100));
  }
  function computeCategoryScore(objectivePct, satisfaction1to10, weight) {
    var objectiveScore = objectivePct == null ? 0 : capRate(objectivePct);
    var satisfactionScore = satisfactionToScore(satisfaction1to10);
    if (satisfactionScore == null) satisfactionScore = 0;
    var finalScore = objectiveScore * weight.objective + satisfactionScore * weight.satisfaction;
    return {
      objectiveScore: Math.round(objectiveScore * 10) / 10,
      satisfactionScore: Math.round(satisfactionScore * 10) / 10,
      finalScore: Math.round(Math.max(0, Math.min(100, finalScore)) * 10) / 10,
      isDataInsufficient: (objectivePct == null && weight.objective > 0) || (satisfaction1to10 == null && weight.satisfaction > 0)
    };
  }
  function populationStdDev(values) {
    if (values.length === 0) return 0;
    var mean = values.reduce(function (a, b) { return a + b; }, 0) / values.length;
    var variance = values.reduce(function (sum, v) { return sum + Math.pow(v - mean, 2); }, 0) / values.length;
    return Math.sqrt(variance);
  }
  function computeHarmonyIndex(scores) {
    var sd = populationStdDev(scores);
    var raw = 100 - (sd / 50) * 100;
    return Math.max(0, Math.min(100, Math.round(raw * 10) / 10));
  }
  function computeLifeScore(scores) {
    if (scores.length === 0) return 0;
    var avg = scores.reduce(function (a, b) { return a + b; }, 0) / scores.length;
    return Math.round(avg * 10) / 10;
  }
  function computeRecordRate(recorded, applicable) {
    if (applicable <= 0) return null;
    var rate = (recorded / applicable) * 100;
    return Math.max(0, Math.min(100, Math.round(rate * 10) / 10));
  }
  var DEFAULT_ON_TIME = { hours: 18, minutes: 20 };
  function parseTimeStr(v) {
    var p = v.split(":").map(Number);
    return { hours: p[0], minutes: p[1] };
  }
  function evaluateLeaveTime(actual, threshold) {
    threshold = threshold || DEFAULT_ON_TIME;
    var a = actual.hours * 60 + actual.minutes;
    var t = threshold.hours * 60 + threshold.minutes;
    if (a <= t) return { isOnTime: true, delayMinutes: 0 };
    return { isOnTime: false, delayMinutes: a - t };
  }
  function isProjectStale(lastUpdatedIso, todayDate, thresholdDays) {
    thresholdDays = thresholdDays == null ? 14 : thresholdDays;
    var diffDays = (todayDate.getTime() - parseISODate(lastUpdatedIso).getTime()) / 86400000;
    return diffDays >= thresholdDays;
  }
  function progressDeltaInRange(logs, rangeStart, rangeEnd) {
    return logs.filter(function (l) {
      var d = parseISODate(l.logged_date).getTime();
      return d >= rangeStart.getTime() && d <= rangeEnd.getTime();
    }).reduce(function (sum, l) { return sum + (l.progress_after - l.progress_before); }, 0);
  }
  var MIN_DAYS_FOR_TREND = 30;

  function getThreshold() {
    try { return parseTimeStr(DB.get().settings.onTimeThreshold || "18:20"); }
    catch (e) { return DEFAULT_ON_TIME; }
  }

  /* ============================== 대시보드 계산 ============================== */
  function onTimeThresholdObj() { return getThreshold(); }

  /**
   * 회사 점수 = 퇴근 점수(정시 비율) 50% + 식사/회식 빈도 점수 50%.
   * - 퇴근 점수: 기존과 동일 (정시 비율 70% + 기록 여부 30%, 정시 기준은 설정의 onTimeThreshold, 기본 18:20).
   * - 식사 점수: 점심/저녁/회식 횟수(커피 제외) 합산이 월 목표(기본 5회) 도달 시 만점, 이하는 비례,
   *   초과하면 균형이 무너진다고 보고 감점(초과 1회당 목표 5회 기준 10점씩, 조회 기간에 비례해서 스케일).
   * - 둘 중 하나만 기록이 있으면 그 값만 사용, 둘 다 없으면 데이터 부족(null).
   */
  function computeCompanySnapshot(range) {
    var db = DB.get();
    var leaves = db.leaveRecords.filter(function (l) { return inRangeStr(l.work_date, range) && !l.excluded && l.actual_time; });
    var onTimeCount = leaves.filter(function (l) { return evaluateLeaveTime(parseTimeStr(l.actual_time), onTimeThresholdObj()).isOnTime; }).length;
    var onTimeRate = leaves.length > 0 ? (onTimeCount / leaves.length) * 100 : null;
    var goalPct = leaves.length > 0 ? 100 : 0;
    var leaveScore = onTimeRate == null ? null : onTimeRate * 0.7 + goalPct * 0.3;

    var mealActs = db.companyActivities.filter(function (a) {
      return inRangeStr(a.activity_date, range) && (a.subtype === "lunch" || a.subtype === "dinner" || a.subtype === "dinner_party");
    });
    var mealCount = mealActs.reduce(function (s, a) { return s + (a.count || 1); }, 0);
    var mealScore = null;
    if (db.companyActivities.length > 0) {
      var rangeDays = rangeDayCount(range);
      var monthlyTarget = (db.targets.companyMealMonthlyTarget > 0) ? db.targets.companyMealMonthlyTarget : 5;
      var targetForRange = Math.max(0.0001, (monthlyTarget / 30) * rangeDays);
      if (mealCount <= targetForRange) {
        mealScore = (mealCount / targetForRange) * 100;
      } else {
        var excess = mealCount - targetForRange;
        var deductionRate = (100 / targetForRange) / 2;
        mealScore = 100 - excess * deductionRate;
      }
      mealScore = Math.max(0, Math.min(100, mealScore));
    }

    var objective;
    if (leaveScore == null && mealScore == null) objective = null;
    else if (leaveScore == null) objective = mealScore;
    else if (mealScore == null) objective = leaveScore;
    else objective = leaveScore * 0.5 + mealScore * 0.5;

    return {
      key: "company", objectiveAchievementPct: objective,
      satisfaction1to10: monthlySatisfactionFor(range, "company"),
      recordedUnits: leaves.length + mealActs.length, applicableUnits: leaves.length + mealActs.length
    };
  }
  /** 출근시간은 오전 8시 30분으로 고정하고, 퇴근 기록에서 이 시각까지의 근무시간을 역산한다. */
  var WORK_START = { hours: 8, minutes: 30 };
  /** 이번 달 회사 관련 누적 사용 비용(식사/커피/회식 전체) + 점수에 반영되는 식사 횟수 + 근무시간 합계 */
  function companySpendSnapshot(anchorDateStr) {
    var db = DB.get();
    var anchor = parseISODate(anchorDateStr);
    var range = toQueryRange(fullMonthRange(anchor));
    var acts = db.companyActivities.filter(function (a) { return inRangeStr(a.activity_date, range); });
    var total = acts.reduce(function (s, a) { return s + (a.amount_krw || 0); }, 0);
    var mealCount = acts.filter(function (a) { return a.subtype === "lunch" || a.subtype === "dinner" || a.subtype === "dinner_party"; })
      .reduce(function (s, a) { return s + (a.count || 1); }, 0);
    var leaves = db.leaveRecords.filter(function (l) { return inRangeStr(l.work_date, range) && !l.excluded && l.actual_time; });
    var startMinutes = WORK_START.hours * 60 + WORK_START.minutes;
    var totalWorkMinutes = leaves.reduce(function (s, l) {
      var t = parseTimeStr(l.actual_time);
      var mins = t.hours * 60 + t.minutes;
      return s + Math.max(0, mins - startMinutes);
    }, 0);
    var totalWorkHours = Math.round((totalWorkMinutes / 60) * 10) / 10;
    return { total: total, mealCount: mealCount, totalWorkHours: totalWorkHours, monthLabel: (anchor.getMonth() + 1) + "월" };
  }
  /** 이번 달 운동 누적 횟수 (종류 상관없이 완료 체크한 횟수 합, 점수 계산과 동일한 기준) */
  function exerciseMonthlySnapshot(anchorDateStr) {
    var db = DB.get();
    var anchor = parseISODate(anchorDateStr);
    var range = toQueryRange(fullMonthRange(anchor));
    var rows = db.exerciseRecords.filter(function (r) { return inRangeStr(r.activity_date, range) && r.completed; });
    return { count: rows.length, monthLabel: (anchor.getMonth() + 1) + "월" };
  }
  /**
   * 홈 화면 하단 캘린더용: anchorDateStr이 속한 달에서, 영역 상관없이 하루라도 어떤 기록이든
   * 있었던 날짜(YYYY-MM-DD)를 key로 갖는 맵을 반환한다. 진행률 로그(사이드 프로젝트)는
   * 프로젝트 자체가 아니라 "그날 기록을 남겼는지"가 기준이라 projectProgressLogs를 본다.
   */
  function activityDatesInMonth(anchorDateStr) {
    var db = DB.get();
    var anchor = parseISODate(anchorDateStr);
    var range = toQueryRange(fullMonthRange(anchor));
    var dates = {};
    function mark(arr, field) {
      arr.forEach(function (r) { if (inRangeStr(r[field], range)) dates[r[field]] = true; });
    }
    mark(db.companyActivities, "activity_date");
    mark(db.leaveRecords, "work_date");
    mark(db.exerciseRecords, "activity_date");
    mark(db.familyRecords, "activity_date");
    mark(db.projectProgressLogs, "logged_date");
    mark(db.extraIncomes, "occurred_date");
    mark(db.selfTimeRecords, "start_date");
    mark(db.thoughtRecords, "date");
    mark(db.investmentRecords, "date");
    return dates;
  }
  /** activityDatesInMonth와 같은 기준이지만 달 제한 없이 전체 기록 기간의 날짜를 모은다(스트릭 계산용). */
  function allActivityDates() {
    var db = DB.get();
    var dates = {};
    function mark(arr, field) {
      arr.forEach(function (r) { if (r[field]) dates[r[field]] = true; });
    }
    mark(db.companyActivities, "activity_date");
    mark(db.leaveRecords, "work_date");
    mark(db.exerciseRecords, "activity_date");
    mark(db.familyRecords, "activity_date");
    mark(db.projectProgressLogs, "logged_date");
    mark(db.extraIncomes, "occurred_date");
    mark(db.selfTimeRecords, "start_date");
    mark(db.thoughtRecords, "date");
    mark(db.investmentRecords, "date");
    return dates;
  }
  /**
   * 영역 상관없이 지금까지 기록이 단 하나라도 있는지. 완전히 처음 켠 상태(전부 0점)인지
   * 판단하는 데 쓴다 — 이땐 라이프 점수·조화지수 같은 숫자를 그대로 보여주는 대신
   * 환영 화면으로 안내하는 게 훨씬 덜 혼란스럽다.
   */
  function hasAnyRecords() {
    var db = DB.get();
    return !!(db.companyActivities.length || db.leaveRecords.length || db.exerciseRecords.length ||
      db.familyRecords.length || db.projectProgressLogs.length || db.extraIncomes.length ||
      db.selfTimeRecords.length || db.thoughtRecords.length || db.investmentRecords.length);
  }
  /**
   * 오늘 기준 연속 기록일수(스트릭). 오늘 아직 기록을 안 남겼어도 어제까지 이어져 있었다면
   * 아직 끊긴 게 아니므로(오늘 하루가 아직 안 끝났으므로) 어제부터 거슬러 올라가며 센다.
   * 오늘도 어제도 기록이 없으면 스트릭은 0.
   */
  function computeStreak() {
    var dates = allActivityDates();
    var cursor = new Date();
    var cursorStr = fmtISO(cursor);
    var includesToday = !!dates[cursorStr];
    if (!includesToday) {
      cursor.setDate(cursor.getDate() - 1);
      cursorStr = fmtISO(cursor);
      if (!dates[cursorStr]) return { count: 0, includesToday: false };
    }
    var count = 0;
    while (dates[cursorStr]) {
      count++;
      cursor.setDate(cursor.getDate() - 1);
      cursorStr = fmtISO(cursor);
    }
    return { count: count, includesToday: includesToday };
  }
  /**
   * 운동 목표 달성률 = 주당 운동 횟수 기준. "일주일에 N번 이상이면 만점" 규칙.
   * 조회 범위(일수)에 비례해 목표 횟수를 환산한다 (예: 4회/주 목표, 30일 범위 → 30/7*4 ≈ 17.1회가 만점 기준).
   */
  function computeExerciseSnapshot(range) {
    var db = DB.get();
    var rows = db.exerciseRecords.filter(function (r) { return inRangeStr(r.activity_date, range) && r.completed; });
    var rangeDays = rangeDayCount(range);
    var weeklyTarget = (db.targets.exerciseWeeklyTarget > 0) ? db.targets.exerciseWeeklyTarget : 4;
    var targetForRange = (weeklyTarget / 7) * rangeDays;
    var objective = rows.length > 0 ? Math.min(100, (rows.length / targetForRange) * 100) : null;
    var daysWithExercise = {};
    rows.forEach(function (r) { daysWithExercise[r.activity_date] = true; });
    return {
      key: "exercise", objectiveAchievementPct: objective,
      satisfaction1to10: monthlySatisfactionFor(range, "exercise"),
      recordedUnits: Object.keys(daysWithExercise).length, applicableUnits: rangeDayCount(range)
    };
  }
  /** count/target을 0~100%로 변환. target이 0이거나 비어있으면(설정 실수 등) 0으로 나누기 대신 0%로 처리한다. */
  function safeRatePct(count, target) {
    if (!(target > 0)) return 0;
    return Math.min(100, (count / target) * 100);
  }
  function computeFamilySnapshot(range) {
    var db = DB.get();
    var t = db.targets;
    var records = db.familyRecords.filter(function (r) { return inRangeStr(r.activity_date, range); });
    var parents = records.filter(function (r) { return r.family_type === "parents"; });
    var star = records.filter(function (r) { return r.family_type === "star"; });
    var contactRate = (
      safeRatePct(parents.filter(function (r) { return r.contacted; }).length, t.familyParentsContactPerMonth) +
      safeRatePct(star.filter(function (r) { return r.contacted; }).length, t.familyStarContactPerMonth)
    ) / 2;
    var parentsMinutes = parents.reduce(function (s, r) { return s + (r.minutes_spent || 0); }, 0);
    var starMinutes = star.reduce(function (s, r) { return s + (r.minutes_spent || 0); }, 0);
    var timeRate = (
      safeRatePct(parentsMinutes, t.familyParentsMinutesPerMonth) +
      safeRatePct(starMinutes, t.familyStarMinutesPerMonth)
    ) / 2;
    var objective = records.length > 0 ? contactRate * 0.5 + timeRate * 0.5 : null;
    return {
      key: "family", objectiveAchievementPct: objective,
      satisfaction1to10: monthlySatisfactionFor(range, "family"),
      recordedUnits: records.length, applicableUnits: records.length
    };
  }
  /**
   * 사이드 프로젝트 점수 = "동시에 진행 중인 프로젝트 개수" 기준(균등 배분).
   * 예: 목표 5개 → 5개 이상 진행 중이면 100점, 1개면 20점, 0개면 0점(데이터 부족).
   * "중단"으로 표시하지 않는 한 계속 진행 중으로 카운트한다(자동 정체 판정 없음).
   */
  function computeSideProjectSnapshot(range) {
    var db = DB.get();
    var t = db.targets;
    var activeProjects = db.sideProjects.filter(function (p) { return p.status !== "stopped"; });
    var target = (t.sideProjectActiveTarget > 0) ? t.sideProjectActiveTarget : 5;
    var objective = db.sideProjects.length > 0 ? Math.min(100, (activeProjects.length / target) * 100) : null;
    var recordedUnits = db.projectProgressLogs.filter(function (l) { return inRangeStr(l.logged_date, range); }).length;
    return {
      key: "side_project", objectiveAchievementPct: objective,
      satisfaction1to10: monthlySatisfactionFor(range, "side_project"),
      recordedUnits: activeProjects.length, applicableUnits: target
    };
  }
  /**
   * "올해 1월 1일부터 asOfDateStr까지 입력한 총 추가소득 ÷ 경과 월수(=asOfDateStr의 달, 1~12)"
   * 를 "월평균 추가소득"으로 보고, 이 값을 목표(월 300만원 등)와 비교한다.
   * 예: 8/30 기준 누적 1000만원 → 1000만원 ÷ 8(월) = 월평균 125만원.
   */
  function incomeCumulativeAsOf(asOfDateStr) {
    var db = DB.get();
    var asOf = parseISODate(asOfDateStr);
    var year = asOf.getFullYear();
    var monthNum = asOf.getMonth() + 1;
    var yearStart = year + "-01-01";
    var incomesYtd = db.extraIncomes.filter(function (i) { return i.occurred_date >= yearStart && i.occurred_date <= asOfDateStr; });
    var cumulativeTotal = incomesYtd.reduce(function (s, i) { return s + (i.amount_krw || 0); }, 0);
    var avgMonthly = cumulativeTotal / monthNum;
    return { year: year, monthNum: monthNum, cumulativeTotal: cumulativeTotal, avgMonthly: avgMonthly, count: incomesYtd.length };
  }

  function computeIncomeSnapshot(range) {
    var db = DB.get();
    var incomes = db.extraIncomes.filter(function (i) { return inRangeStr(i.occurred_date, range); });
    var rangeEndInclusive = fmtISO(new Date(parseISODate(range.end).getTime() - 86400000));
    var cum = incomeCumulativeAsOf(rangeEndInclusive);
    var target = db.targets.incomeMonthlyTargetKrw;
    var objective = cum.count > 0 && target > 0 ? Math.min(100, (cum.avgMonthly / target) * 100) : null;
    return {
      key: "extra_income", objectiveAchievementPct: objective,
      satisfaction1to10: monthlySatisfactionFor(range, "extra_income"),
      recordedUnits: incomes.length, applicableUnits: incomes.length

   * 포커스가 그대로 남아 "오토포커싱이 안 되는" 것처럼 보인다. 그런 화면에서는 대신

  function focusFirstField(scopeEl) {
    setTimeout(function () {
      function isVisible(elm) { return !!(elm.offsetWidth || elm.offsetHeight || elm.getClientRects().length); }

      for (var i = 0; i < candidates.length; i++) {
        var c = candidates[i];
        if (c.type === "hidden" || c.disabled) continue;
        if (!isVisible(c)) continue; // display:none 등 숨김 필드는 건너뜀

        return;

  /**
   * mode: "same-period"(이번 달 동일 기간까지) | "full-month"(각각 월 전체) | 생략 시 자동
   * (이번 달이 진행 중이면 동일 기간, 끝난 두 달이면 전체 월 비교).
   */
  function computeRanges(mode) {
    var today = new Date();
    var currentAnchor = today;
    var previousAnchor = subMonths(today, 1);
    var resolved;
    if (mode === "same-period") {
      var currentRange = { start: startOfMonth(currentAnchor), end: today };
      resolved = { mode: "same-period", current: currentRange, previous: sameRangeInPreviousMonth(currentRange.start, currentRange.end) };
    } else if (mode === "full-month") {
      resolved = { mode: "full-month", current: fullMonthRange(currentAnchor), previous: fullMonthRange(previousAnchor) };
    } else {
      resolved = resolveComparisonRanges(currentAnchor, previousAnchor, today);
    }
    return {
      today: today,
      mode: resolved.mode,
      currentRaw: resolved.current,
      previousRaw: resolved.previous,
      current: toQueryRange(resolved.current),
      previous: toQueryRange(resolved.previous),
      currentYearMonth: toYearMonth(today)
    };
  }

   * 그래서 기록이 하나라도 생기기 전까지는 숫자 대신 안내와 시작 버튼만 보여준다.

   * leaveRecords 두 테이블에 걸쳐 있어 하나의 키("company")로 합산한다(기록 화면의 유형 필터에서는
   * 이 둘이 "회사"/"퇴근"으로 나뉘어 있으므로, 이 칩을 눌렀을 땐 유형 필터 없이 날짜만 필터한다).
   */
  function todayRecordCounts() {
    var db = DB.get();
    var today = todayISO();
    var counts = {};
    function bump(key) { counts[key] = (counts[key] || 0) + 1; }
    db.companyActivities.forEach(function (a) { if (a.activity_date === today) bump("company"); });
    db.leaveRecords.forEach(function (l) { if (l.work_date === today) bump("company"); });
    db.exerciseRecords.forEach(function (r) { if (r.activity_date === today) bump("exercise"); });
    db.familyRecords.forEach(function (f) { if (f.activity_date === today) bump("family"); });
    db.projectProgressLogs.forEach(function (p) { if (p.logged_date === today) bump("side_project"); });
    db.extraIncomes.forEach(function (i) { if (i.occurred_date === today) bump("extra_income"); });
    db.selfTimeRecords.forEach(function (s) { if (s.start_date === today) bump("self_time"); });
    db.thoughtRecords.forEach(function (t) { if (t.date === today) bump("thought"); });
    db.investmentRecords.forEach(function (v) { if (v.date === today) bump("investment"); });
    return counts;
  }

      // 화면이 바뀌기 전에 사라져 사용자가 볼 수 없다. 토스트 문구 자체에 결과를 담아서 보여준다.
      saveOrToast(evaluated.isOnTime ? "정시퇴근으로 저장했어요!" : evaluated.delayMinutes + "분 지연 퇴근으로 저장했어요.");

        save(pad2(now.getHours()) + ":" + pad2(now.getMinutes()));

    }
    var onTimeBtn = wrap.querySelector("#onTimeBtn");
    if (onTimeBtn) {
      onTimeBtn.addEventListener("click", function () { save(thresholdStr); });
    }
    wrap.querySelector("#manualSaveBtn").addEventListener("click", function () {
      var v = wrap.querySelector("#manualTime").value;
      if (!v) return;

          if (!isFinite(rawVal)) { showToast("올바른 진행률 숫자를 입력해주세요"); return; }
          var newVal = Math.max(0, rawVal); // 진행률(누적 점수)에 음수가 저장되지 않도록 보정
          if (editing) {
            var log = db.projectProgressLogs.filter(function (x) { return x.id === editing.id; })[0];
            var project = db.sideProjects.filter(function (p) { return p.id === editing.project_id; })[0];
            if (!log || !project) { state.editRecord = null; navigate("records"); return; }
            log.logged_date = fd.get("logged_date");
            log.progress_after = newVal;
            project.current_progress = newVal;
            project.last_updated_at = fd.get("logged_date");
            state.editRecord = null;
            saveOrToast("수정했어요!");
            navigate("records");
            return;
          }
          var pid = fd.get("project_id");
          var project2 = db.sideProjects.filter(function (p) { return p.id === pid; })[0];
          if (!project2) return;
          db.projectProgressLogs.push({ id: uid(), project_id: pid, logged_date: fd.get("logged_date"), progress_before: project2.current_progress, progress_after: newVal });
          project2.current_progress = newVal;
          project2.last_updated_at = fd.get("logged_date");
          saveOrToast("저장했어요!");
          navigate("quick", { quickTab: "side_project" });
        });
      }
    }
    return wrap;
  }

  /* ============================== 생각 기록: 라이프 코치 피드백 ==============================
   * 이 앱은 서버/로그인 없이 완전히 오프라인으로 동작하도록 설계됐다. 기본값은 여전히
   * 로컬(오프라인) 규칙 기반 피드백으로, 입력한 글에 담긴 키워드에 따라 Brian Tracy의 대표
   * 저서·강연에서 널리 알려진 원칙(아래 각 버킷 주석 참고: Eat That Frog!, Goals!, No Excuses!,
   * Maximum Achievement, The Way to Wealth, Million Dollar Habits 등)을 바탕으로 미리 준비한
   * 문장 중 하나를 골라 보여준다. (실제 그의 발언을 그대로 인용한 것이 아니라, 잘 알려진
   * 원칙을 참고해 재구성한 문장이며, 각 문장 옆에 참고한 책/개념을 출처로 함께 표시한다.)
   *
   * 설정 화면에서 Anthropic API 키를 넣어두면, 이 로컬 로직 대신 실제 Claude API를 호출해서
   * 그 응답을 그대로 피드백으로 쓴다(callCoachLLM 참고 - 서버 없이 브라우저에서 직접 호출).
   * 키가 없거나 호출이 실패하면 항상 아래 로컬 로직으로 자동 대체되므로, 오프라인에서도 이
   * 기능은 계속 동작한다.
   *
   * 매칭 로직: 예전에는 "글에 어떤 버킷의 키워드가 하나라도 있으면 그 시점에서 확정"하는
   * 방식이라, 순서상 앞에 있는 버킷이 자주 이겼다. 지금은 모든 버킷에 대해 키워드가 몇 개나
   * 일치하는지 점수를 매겨서 가장 많이 겹치는 버킷을 고르고(더 정교한 매칭), 점수가 동률일
   * 때만 아래 PRIORITY 순서로 정한다. 또한 같은 이야기를 반복해서 남길 때 매번 똑같은 문장이
   * 나오지 않도록, 최근에 이미 받은 문장은 가능하면 피해서 고른다.
   */

  /* 한국어 ㅂ 불규칙 형용사(두렵다→두려워/두렵고, 무섭다→무서워/무섭고 등)는 활용형에 따라

  /** 동률일 때만 쓰이는 우선순위(감정 상태 -> 구체적 행동 프레임워크 -> 격려 -> 학습 순). */
  var COACH_BUCKET_PRIORITY = ["stress", "fear", "decision", "procrastination", "priority", "goal", "money", "habit", "health", "relationship", "positive", "learning"];
  /**
   * text에 등장하는 키워드 수를 버킷별로 세어, 가장 많이 겹치는 버킷을 고른다(글 하나에 여러
   * 맥락이 섞여 있어도 가장 관련도 높은 원칙을 골라줄 수 있도록). avoidTexts에 있는 문장은
   * (같은 버킷 안에 다른 선택지가 남아있는 한) 최근에 이미 받은 문장이라 판단해 가능하면 피한다.
   */
  function generateCoachFeedback(text, avoidTexts) {
    var bestBucket = "default";
    var bestScore = 0;
    for (var i = 0; i < COACH_BUCKET_PRIORITY.length; i++) {
      var key = COACH_BUCKET_PRIORITY[i];
      var score = COACH_KEYWORDS[key].reduce(function (acc, kw) { return acc + (text.indexOf(kw) !== -1 ? 1 : 0); }, 0);
      if (score > bestScore) { bestScore = score; bestBucket = key; }
    }
    var pool = COACH_FEEDBACK_POOL[bestBucket];
    var avoid = avoidTexts || [];
    var candidates = pool.filter(function (item) { return avoid.indexOf(item.text) === -1; });
    if (!candidates.length) candidates = pool; // 전부 최근에 나온 적이 있다면 그냥 전체 풀에서 다시 고른다
    var picked = candidates[Math.floor(Math.random() * candidates.length)];
    return { text: picked.text, source: picked.source, bucket: bestBucket };
  }

  /**
   * 설정 화면에서 Anthropic API 키를 넣어둔 경우에만 시도하는 실제 LLM 호출.
   * 이 앱은 서버가 없는 단일 HTML 파일이라, 브라우저에서 Anthropic API를 직접 호출할 수 있게
   * 해주는 공식 헤더(anthropic-dangerous-direct-browser-access)를 사용한다. 키는 사용자가
   * 설정 화면에서 직접 넣어 이 브라우저의 로컬 저장소에만 보관되고, 피드백을 요청하는 순간에만
   * Anthropic 서버로 전송된다. 네트워크 문제·키 오류·타임아웃 등 어떤 이유로 실패하든 예외를
   * 던지지 않고 콜백에 null을 넘겨서, 호출부가 항상 로컬 규칙 기반 피드백으로 안전하게 대체할
   * 수 있게 한다(오프라인에서도 앱이 멈추지 않는다는 이 앱의 핵심 원칙을 그대로 따른다).
   *
   * 한 번의 호출로 (1) 코칭 피드백과 (2) 원문을 자연스러운 일상 업무체 영어로 옮긴 번역을
   * 함께 받는다(API 호출 비용을 두 배로 만들지 않기 위해 두 요청으로 나누지 않았다). 모델이
   * "FEEDBACK: ... TRANSLATION: ..." 형식으로 답하도록 지시하고, parseCoachResponse가 그
   * 형식을 파싱한다 - 혹시 모델이 형식을 안 지켜도 전체 응답을 피드백으로만 쓰고 번역은

      var step = used.length / MAX_ENTRIES;
      var sampled = [];
      for (var i = 0; i < MAX_ENTRIES; i++) sampled.push(used[Math.floor(i * step)]);
      used = sampled;
      truncatedNote = "(참고: 이번 달 글이 총 " + entries.length + "건이라 시간순으로 고르게 뽑은 대표 " + MAX_ENTRIES + "건만 보여드려요.)\n";
    }
    var lines = used.map(function (e) {
      var t = e.text.length > MAX_CHARS_PER_ENTRY ? e.text.slice(0, MAX_CHARS_PER_ENTRY) + "…" : e.text;
      return fmtDateKo(e.date) + " [" + e.category + "] " + t;
    });
    var byCategory = {};
    entries.forEach(function (e) { byCategory[e.category] = (byCategory[e.category] || 0) + 1; });
    var categoryLine = Object.keys(byCategory).map(function (k) { return k + " " + byCategory[k] + "건"; }).join(", ");

    var prevBlock = "";
    if (prevCtx && prevCtx.entryCount > 0) {
      prevBlock = "\n\n[지난달(" + prevCtx.monthLabel + ") 참고 정보 - 비교용입니다. 이 안의 내용을 새 사실처럼 지어내지 말고 비교에만 참고하세요]\n" +
        "지난달 글 " + prevCtx.entryCount + "건, 라이프 점수 " + prevCtx.lifeScore + "점, 조화지수 " + prevCtx.harmonyIndex + "점" +
        (prevCtx.reportText ? "\n지난달 리포트 요지: " + prevCtx.reportText.slice(0, 400) : "");
    }

    return monthLabel + " 기록입니다.\n라이프 점수 " + dashboard.lifeScore + "점, 조화지수 " + dashboard.harmonyIndex + "점.\n" +
      "이번 달 글 " + entries.length + "건 (" + categoryLine + ")\n" + truncatedNote + "\n" +
      lines.join("\n") + prevBlock;
  }
  /** callCoachLLM과 같은 방식(브라우저 직접 호출, 실패해도 예외를 던지지 않고 null 콜백)이지만
   * 리포트는 훨씬 긴 텍스트를 한 번에 보낼 수 있어 타임아웃을 더 길게 두고, 응답도 "FEEDBACK:"
   * 같은 특수 형식 없이 리포트 본문 그대로를 받는다. */
  function callMonthlyReportLLM(userPrompt, apiKey, model, cb) {
    if (!apiKey) { cb(null); return; }
    var called = false;
    function done(result) { if (called) return; called = true; cb(result); }
    var timeoutId = setTimeout(function () { done(null); }, 25000);
    fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: model || "claude-haiku-4-5-20251001",
        max_tokens: 900,
        system: MONTHLY_REPORT_SYSTEM_PROMPT,
        messages: [{ role: "user", content: userPrompt }]
      })
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function (json) {
      var textOut = json && json.content && json.content[0] && json.content[0].text;
      done(textOut ? textOut.trim() : null);
    }).catch(function () {
      done(null);
    }).then(function () { clearTimeout(timeoutId); });
  }
  /** "월간 분석" 화면 안에 들어가는 인사이트 리포트 카드. 달을 앞뒤로 넘길 수 있고(미래 달은 막는다),
   * 그 달에 이미 만든 리포트가 있으면 보여주고, 없으면 만들기 버튼을 보여준다. */
  /**
   * returnView: 이 카드의 prev/next 달 이동, 리포트 생성/재생성 버튼을 누른 뒤 다시 렌더링할
   * 화면. 원래 "월간 분석" 화면 전용으로 만들어졌던 카드라 기본값은 "compare"이고, "AI 코치"
   * 화면의 "리포트" 탭처럼 다른 화면에 이 카드를 그대로 재사용할 땐 그 화면의 id를 넘긴다.
   */
  function renderMonthlyReportCard(returnView) {
    returnView = returnView || "compare";
    var wrap = el('<div class="card" style="margin-top:14px;"></div>');
    var db = DB.get();
    var anchor = state.reportMonthAnchor ? parseISODate(state.reportMonthAnchor) : new Date();
    var monthKey = toYearMonth(anchor);
    var monthLabel = anchor.getFullYear() + "년 " + (anchor.getMonth() + 1) + "월";
    var range = monthReportRange(anchor);
    var entries = collectMonthlyEntries(db, range);
    var existing = (db.monthlyReports || []).filter(function (r) { return r.month === monthKey; })[0];
    var isCurrentMonth = monthKey === toYearMonth(new Date());
    var dashboard = computeDashboard(range);

    wrap.innerHTML =
      '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">' +
        '<h2 class="section-title" style="margin:0;"><span class="ai-icon-badge">🧾</span> 월간 인사이트 리포트</h2>' +
        '<div style="display:flex; align-items:center; gap:4px;">' +
          '<button type="button" class="icon-btn" id="reportPrevMonth" aria-label="이전 달" style="border:1px solid var(--color-border);">‹</button>' +
          '<span class="small" style="min-width:64px; text-align:center;">' + monthLabel + '</span>' +
          '<button type="button" class="icon-btn" id="reportNextMonth" aria-label="다음 달" ' + (isCurrentMonth ? "disabled" : "") + ' style="border:1px solid var(--color-border);">›</button>' +
        '</div>' +
      '</div>' +
      (existing
        ? '<p class="tiny muted" style="margin:0 0 8px;">' + (existing.mode === "llm" ? "Claude API가 실시간으로 작성했어요" : "이 브라우저 안에서 로컬로 요약했어요") + ' · ' + fmtRelativeTime(existing.generatedAt) + '</p>' +
          '<div style="background:var(--color-accent-light); border-radius:12px; padding:12px 14px; white-space:pre-wrap;" class="small">' + escapeHtml(existing.text) + '</div>' +
          '<button type="button" class="btn btn-block" id="reportRegenBtn" style="margin-top:10px;">다시 만들기</button>'
        : '<p class="small muted" style="margin:0 0 10px;">' + (entries.length ? monthLabel + '에 남긴 글 ' + entries.length + '건을 바탕으로 리포트를 만들어요.' : '아직 ' + monthLabel + '에 남긴 글이 없어요. 생각 기록이나 각 기록의 메모를 남기면 리포트를 만들 수 있어요.') + '</p>' +
          '<button type="button" class="btn btn-primary btn-block" id="reportGenBtn" ' + (entries.length ? "" : "disabled") + '>이 달 리포트 만들기</button>') +
      '<p class="tiny muted" style="margin-top:8px;">이 리포트는 이 브라우저(이 기기)에만 저장되고, 클라우드 동기화 대상에는 포함되지 않아요.</p>';

    wrap.querySelector("#reportPrevMonth").addEventListener("click", function () {
      state.reportMonthAnchor = fmtISO(subMonths(anchor, 1));
      navigate(returnView);
    });
    var nextBtn = wrap.querySelector("#reportNextMonth");
    if (!isCurrentMonth) {
      nextBtn.addEventListener("click", function () {
        state.reportMonthAnchor = fmtISO(addMonthsSafe(anchor, 1));
        navigate(returnView);
      });
    }

    function runGeneration(btn) {
      btn.disabled = true;
      var apiKey = (DB.get().settings.coachApiKey || "").trim();
      btn.textContent = apiKey ? "리포트 만드는 중... (Claude에게 물어보는 중)" : "리포트 만드는 중...";
      // 지난달과 비교하거나(글 수·점수 변화) 지난달과 같은 주제가 반복되는지 보여주기 위한 참고 정보.
      var prevCtx = monthOverMonthContext(db, anchor);
      // 로컬/LLM 모드와 상관없이 이번 달 상위 주제는 항상 계산해서 저장해 둔다 - 다음 달 리포트가
      // "지난달에도 이 주제였는데" 라고 짚어줄 수 있으려면, LLM으로 만든 달도 주제 정보가 남아 있어야 한다.
      var themeKeys = detectThemeBuckets(entries).topKeys;
      function saveReport(text, mode) {
        var db2 = DB.get();
        if (!db2.monthlyReports) db2.monthlyReports = [];
        var idx = db2.monthlyReports.findIndex(function (r) { return r.month === monthKey; });
        var rec = { id: idx >= 0 ? db2.monthlyReports[idx].id : uid(), month: monthKey, generatedAt: new Date().toISOString(), mode: mode, text: text, themeKeys: themeKeys };
        if (idx >= 0) db2.monthlyReports[idx] = rec; else db2.monthlyReports.push(rec);
        saveOrToast("리포트를 만들었어요!");
        navigate(returnView);
      }
      if (apiKey) {
        var prompt = buildMonthlyReportPrompt(entries, dashboard, monthLabel, prevCtx);
        callMonthlyReportLLM(prompt, apiKey, DB.get().settings.coachModel, function (text) {
          if (text) { saveReport(text, "llm"); return; }
          showToast("AI 호출에 실패해서 로컬 요약으로 대신했어요");
          saveReport(generateLocalMonthlyReport(entries, dashboard, monthLabel, prevCtx), "local");
        });
      } else {
        saveReport(generateLocalMonthlyReport(entries, dashboard, monthLabel, prevCtx), "local");
      }
    }
    var genBtn = wrap.querySelector("#reportGenBtn");
    if (genBtn) genBtn.addEventListener("click", function () { runGeneration(genBtn); });
    var regenBtn = wrap.querySelector("#reportRegenBtn");
    if (regenBtn) regenBtn.addEventListener("click", function () { runGeneration(regenBtn); });

    return wrap;
  }

  /* ============================== 화면: AI 코치 ==============================
   * 홈 화면의 "자동 인사이트"/"라이프 코치 피드백" 카드에서 "AI 코치 ›" 링크로 들어오는
   * 별도 화면. 하단 탭(홈/기록/월간 분석/설정)에는 없고, 홈에서 들어와서 뒤로가기로 돌아가는
   * 하위 화면이라 자체적으로 상단에 "‹ 뒤로" 버튼을 둔다. 인사이트/추천 액션/리포트 3개 탭으로
   * 구성되며, "리포트" 탭은 "월간 분석" 화면의 월간 인사이트 리포트 카드를 그대로 재사용한다.
   */
  function renderCoachInsightsTab() {
    var box = el('<div class="card" style="margin-top:14px;"></div>');
    if (!hasAnyRecords()) {
      box.innerHTML = '<p class="small muted">아직 인사이트를 만들 데이터가 없어요. 기록을 남기면 AI 코치가 살펴봐드려요.</p>';
      return box;
    }
    var ranges = computeRanges();
    var current = computeDashboard(ranges.current);
    var previous = computeDashboard(ranges.previous);
    var days = accountAgeDays();
    var insights = generateInsights(current, previous, days);
    var TONE_ICON = { positive: "📈", negative: "🌙", neutral: "💡" };
    box.innerHTML = insights.length ?
      insights.map(function (i) {

        '</div>';
      }).join("")
      : '<p class="small muted">아직 인사이트를 만들 데이터가 부족해요.</p>';

  function renderCoachActionsTab() {

      box.innerHTML = '<p class="small muted">아직 추천할 액션이 없어요. 기록을 남기면 목표 대비 부족한 영역을 짚어드려요.</p>';

    // 목표 달성률(objectiveAchievementPct)을 계산할 수 있는 영역이 하나도 없으면(예: "생각 기록"만
    // 남기고 회사·운동 등 목표가 있는 영역은 하나도 기록하지 않은 경우), 추천할 목표 자체가 없는
    // 것이지 "모든 목표를 잘 달성한" 게 아니다. 이 둘을 구분하지 않으면 실제로는 아무것도 기록하지
    // 않은 사람에게 "목표를 잘 달성하고 있어요!"라고 잘못 축하하게 된다.
    var hasAnyGoalData = current.categories.some(function (c) { return c.objectiveAchievementPct != null; });
    if (!hasAnyGoalData) {

        // 실제 서버 호출은 아니지만, 버튼 클릭 -> 날씨 확인 -> 응답 수신의 흐름을 그대로 재현한다.
        // fetchWeather는 성공/실패 여부와 관계없이 항상 콜백을 정확히 한 번 호출하므로,

        setTimeout(function () {
          fetchWeather(function (weatherData) {
            /** 저장에 필요한 최신 db/rec을 매번 새로 조회한다(비동기 LLM 호출 도중 데이터가

            function saveLocalFeedback() {

      var score = INVESTOR_KEYWORDS[key].reduce(function (acc, kw) { return acc + (text.indexOf(kw) !== -1 ? 1 : 0); }, 0);
      if (score > bestScore) { bestScore = score; bestBucket = key; }
    }
    var pool = INVESTOR_FEEDBACK_POOL[bestBucket];
    var avoid = avoidTexts || [];
    var candidates = pool.filter(function (item) { return avoid.indexOf(item.text) === -1; });
    if (!candidates.length) candidates = pool;
    var picked = candidates[Math.floor(Math.random() * candidates.length)];
    return { text: picked.text, source: picked.source, bucket: bestBucket };
  }
  /** feedbackBoxHtml을 단순화한 버전 - 항상 로컬 규칙 기반이라 날씨 태그·LLM/로컬 모드 분기·

        '<div class="tiny muted" style="margin:-2px 0 6px;">피터 린치의 &lt;월가의 영웅(One Up on Wall Street)&gt; 원칙을 바탕으로 정리한 피드백이에요' + sourceTag + '</div>' +
        '<div class="small">' + escapeHtml(r.feedback) + '</div>' +
      '</div>';
  }

  function memoSuffix(memo) {
    if (!memo) return "";
    var m = memo.length > 20 ? memo.slice(0, 20) + "…" : memo;
    return " · 메모: " + m;
  }

  /* ============================== 화면: 월간 비교 ============================== */
  function viewCompare() {
    var ranges = computeRanges(state.compareMode);
    var current = computeDashboard(ranges.current);
    var previous = computeDashboard(ranges.previous);
    var lifeDelta = fmtNum(current.lifeScore - previous.lifeScore);
    var harmonyDelta = fmtNum(current.harmonyIndex - previous.harmonyIndex);
    function deltaClass(d) { return d > 0 ? "up" : d < 0 ? "down" : "flat"; }
    var rows = current.categories.map(function (c) {
      var p = previous.categories.filter(function (x) { return x.key === c.key; })[0];
      var card = QUICK_CARDS.filter(function (q) { return q.key === c.key; })[0];
      return { key: c.key, icon: card ? card.icon : "", prev: p.finalScore, cur: c.finalScore, delta: fmtNum(c.finalScore - p.finalScore) };
    });
    // delta가 실제로 양수/음수일 때만 "성장했다/하락했다"고 표시한다.
    // 정렬만으로 항상 하나씩 골라버리면, 전부 하락한 달에도 "가장 덜 하락한" 영역이
    // "가장 성장한 영역"으로 오인 표시되는 문제가 있었다.
    var mostImprovedRaw = rows.slice().sort(function (a, b) { return b.delta - a.delta; })[0];
    var mostDeclinedRaw = rows.slice().sort(function (a, b) { return a.delta - b.delta; })[0];
    var mostImproved = mostImprovedRaw && mostImprovedRaw.delta > 0 ? mostImprovedRaw : null;
    var mostDeclined = mostDeclinedRaw && mostDeclinedRaw.delta < 0 ? mostDeclinedRaw : null;

    var wrap = el('<div></div>');
    var trendParts = [];
    if (mostImproved) trendParts.push('가장 성장한 영역: <b style="color:var(--color-positive)">' + CATEGORY_LABELS[mostImproved.key] + '</b>');
    if (mostDeclined) trendParts.push('개선 필요: <b style="color:var(--color-negative)">' + CATEGORY_LABELS[mostDeclined.key] + '</b>');
    var rangeLabel = fmtRangeLabel(ranges.currentRaw) + " vs " + fmtRangeLabel(ranges.previousRaw);

    wrap.innerHTML =
      '<div class="card">' +
        '<div class="segmented" id="cmpSegmented">' +
          '<button type="button" data-mode="same-period" class="' + (ranges.mode === "same-period" ? "active" : "") + '">동일 기간</button>' +
          '<button type="button" data-mode="full-month" class="' + (ranges.mode === "full-month" ? "active" : "") + '">월 전체</button>' +
        '</div>' +
        '<p class="range-label">' + rangeLabel + '</p>' +
      '</div>' +
      '<div class="stat-grid" style="margin-top:14px;">' +
        '<div class="stat-card"><div class="stat-label">라이프 점수<button type="button" class="info-btn" data-info="lifeScore" aria-label="라이프 점수란?">ⓘ</button></div><div class="stat-value">' + current.lifeScore + '</div>' +
          '<div class="stat-delta ' + deltaClass(lifeDelta) + '">' + (lifeDelta >= 0 ? "+" : "") + lifeDelta + '</div></div>' +
        '<div class="stat-card"><div class="stat-label">조화지수<button type="button" class="info-btn" data-info="harmonyIndex" aria-label="조화지수란?">ⓘ</button></div><div class="stat-value">' + current.harmonyIndex + '</div>' +
          '<div class="stat-delta ' + deltaClass(harmonyDelta) + '">' + (harmonyDelta >= 0 ? "+" : "") + harmonyDelta + '</div></div>' +
      '</div>' +
      (trendParts.length ? '<p class="small muted" style="margin-top:12px;">' + trendParts.join(" · ") + '</p>' : '<p class="small muted" style="margin-top:12px;">이전 기간과 비교해 뚜렷한 변화가 없어요.</p>') +
      '<div class="card">' +
        '<div class="chart-legend">' +
          '<span><span class="dot" style="background:var(--color-brand);"></span>이번 달</span>' +
          '<span><span class="dot" style="background:var(--color-prev-month);"></span>지난 달</span>' +
        '</div>' +
        '<div id="hexHolder2"></div>' +
      '</div>' +
      '<div class="card" style="margin-top:14px;">' +
